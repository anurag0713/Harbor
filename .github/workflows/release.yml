name: Release Harbor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Harbor (Release)
        run: |
          xcodebuild -project Harbor.xcodeproj \
            -scheme Harbor \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CONFIGURATION_BUILD_DIR="./build" \
            build

      - name: Compress App
        run: |
          ditto -c -k --keepParent build/Harbor.app build/Harbor.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Harbor.zip
          name: Harbor ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update Homebrew Cask
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.HARBOR_HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN secret is not set. Skipping Homebrew Cask update."
            exit 0
          fi

          # 1. Strip the 'v' from tag (e.g. v1.3.0 -> 1.3.0)
          VERSION="${GITHUB_REF_NAME#v}"

          # 2. Compute SHA-256 hash of the zipped app
          SHA256=$(shasum -a 256 build/Harbor.zip | awk '{print $1}')

          # 3. Clone homebrew-harbor using the Personal Access Token
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/anurag0713/homebrew-harbor.git" tap-repo

          cd tap-repo

          # Unset the inherited extraheader from actions/checkout so the repo token doesn't override TAP_TOKEN
          git config --local --unset-all "http.https://github.com/.extraheader" || true

          # 4. Update version and sha256 in Casks/harbor.rb
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/harbor.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/harbor.rb

          # 5. Commit and push if there are changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/harbor.rb
          if git diff --staged --quiet; then
            echo "No changes to commit in Cask definition."
          else
            git commit -m "Bump Harbor to v${VERSION}"
            git push "https://x-access-token:${TAP_TOKEN}@github.com/anurag0713/homebrew-harbor.git" main
          fi
