name: Harbor
options:
  bundleIdPrefix: com.anuragsingh
  deploymentTarget:
    macOS: "14.0"
targets:
  Harbor:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Harbor
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Copyright © 2026 Anurag Singh. All rights reserved."
    settings:
      base:
        PRODUCT_NAME: Harbor
        PRODUCT_BUNDLE_IDENTIFIER: com.anuragsingh.Harbor
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
